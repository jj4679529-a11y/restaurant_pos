name: Build Windows Executables

on:
  push:
    branches: [phase-13-two-monoblock]
  pull_request:
    branches: [phase-13-two-monoblock]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install PyInstaller
        shell: pwsh
        run: |
          python -m pip install pyinstaller

      - name: Run tests
        shell: pwsh
        run: |
          Remove-Item Env:DEBUG -ErrorAction SilentlyContinue
          python -m pytest -q
        continue-on-error: false

      - name: Check alembic
        shell: pwsh
        run: |
          Remove-Item Env:DEBUG -ErrorAction SilentlyContinue
          python -m alembic -c alembic.ini check

      - name: Build RestaurantPOS.exe
        shell: pwsh
        run: |
          Remove-Item Env:DEBUG -ErrorAction SilentlyContinue
          python -m PyInstaller --noconfirm --clean pos.spec

      - name: Build RestaurantAdmin.exe
        shell: pwsh
        run: |
          Remove-Item Env:DEBUG -ErrorAction SilentlyContinue
          python -m PyInstaller --noconfirm --clean admin.spec

      - name: Build RestaurantServer.exe
        shell: pwsh
        run: |
          Remove-Item Env:DEBUG -ErrorAction SilentlyContinue
          python -m PyInstaller --noconfirm --clean server.spec

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: |
            dist/RestaurantPOS.exe
            dist/RestaurantAdmin.exe
            dist/RestaurantServer.exe
          if-no-files-found: error
