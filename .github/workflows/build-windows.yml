name: Build Windows Executables

on:
  push:
    branches: [phase-13-two-monoblock]
  pull_request:
    branches: [phase-13-two-monoblock]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: restaurant_pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Configure DATABASE_URL
        shell: bash
        run: |
          echo "DATABASE_URL=postgresql+psycopg2://postgres@localhost:5432/restaurant_pos" >> $GITHUB_ENV
          echo "DEBUG=false" >> $GITHUB_ENV
          echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV

      - name: Run alembic upgrade
        shell: bash
        run: |
          python -m alembic -c alembic.ini upgrade head

      - name: Verify database connection
        shell: bash
        run: |
          python -c "import os, sqlalchemy; engine=sqlalchemy.create_engine(os.environ['DATABASE_URL']); conn=engine.connect(); conn.execute(sqlalchemy.text('SELECT 1')); conn.close(); print('Database connected')"

      - name: Install Qt runtime dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libdbus-1-3

      - name: Verify Qt runtime
        shell: bash
        run: |
          ldconfig -p | grep libEGL.so.1
          python -c "from PySide6.QtWidgets import QApplication; print('PySide6 OK')"

      - name: Run tests
        shell: bash
        run: |
          export DEBUG=false
          python -m pytest -q
        continue-on-error: false

      - name: Check alembic
        shell: bash
        run: |
          python -m alembic -c alembic.ini check

  build-windows:
    needs: [test]
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install PyInstaller
        shell: pwsh
        run: |
          python -m pip install pyinstaller

      - name: Verify Windows 10 PowerShell compatibility and updater
        shell: powershell
        run: .\scripts\test-deployment.ps1

      - name: Build RestaurantPOS.exe
        shell: pwsh
        run: |
          Remove-Item Env:DEBUG -ErrorAction SilentlyContinue
          python -m PyInstaller --noconfirm --clean pos.spec

      - name: Build RestaurantAdmin.exe
        shell: pwsh
        run: |
          Remove-Item Env:DEBUG -ErrorAction SilentlyContinue
          python -m PyInstaller --noconfirm --clean admin.spec

      - name: Build RestaurantServer.exe
        shell: pwsh
        run: |
          Remove-Item Env:DEBUG -ErrorAction SilentlyContinue
          python -m PyInstaller --noconfirm --clean server.spec

      - name: Build RestaurantBootstrapAdmin.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean bootstrap_admin.spec
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap build failed" }

      - name: Smoke test packaged bootstrap (no database connection)
        shell: pwsh
        run: |
          $env:DEBUG = "false"
          foreach ($driver in @("psycopg", "psycopg2")) {
            $env:DATABASE_URL = "postgresql+${driver}://unused@127.0.0.1:1/restaurant_pos"
            & .\dist\RestaurantBootstrapAdmin.exe --self-test
            if ($LASTEXITCODE -ne 0) { throw "Packaged bootstrap smoke test failed" }
          }
          Remove-Item Env:DATABASE_URL
          & .\dist\RestaurantBootstrapAdmin.exe
          if ($LASTEXITCODE -ne 1) { throw "Missing DATABASE_URL was not rejected" }
          exit 0

      - name: Create binary checksums
        shell: pwsh
        run: |
          $hashes = @{}
          foreach ($name in @('RestaurantServer.exe', 'RestaurantPOS.exe', 'RestaurantAdmin.exe')) {
            $hashes[$name] = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash
          }
          $hashes | ConvertTo-Json | Set-Content dist/SHA256.json -Encoding UTF8
          Copy-Item scripts/update_windows.ps1 dist/
          Copy-Item scripts/install_autostart_windows.ps1 dist/
          Copy-Item scripts/start-runtime.ps1 dist/
          Copy-Item scripts/test-deployment.ps1 dist/
          Copy-Item scripts/cleanup_client_transactions.ps1 dist/
          Copy-Item version.json dist/

      - name: Prepare Monoblock 1 installation package
        shell: pwsh
        run: |
          $root = 'dist/RestaurantPOS'
          foreach ($folder in @('app', 'config', 'scripts', 'logs', 'media', 'backups')) {
            New-Item -ItemType Directory -Path "$root/$folder" -Force | Out-Null
          }
          foreach ($name in @('RestaurantServer.exe', 'RestaurantPOS.exe', 'RestaurantAdmin.exe', 'SHA256.json')) {
            Copy-Item "dist/$name" "$root/app/"
          }
          foreach ($name in @('update_windows.ps1', 'install_autostart_windows.ps1', 'start-runtime.ps1', 'test-deployment.ps1', 'cleanup_client_transactions.ps1')) {
            Copy-Item "scripts/$name" "$root/scripts/$name"
          }
          Copy-Item version.json "$root/version.json"
          Copy-Item docs/monoblock1-install.txt "$root/INSTALL.txt"
          Set-Content "$root/config/README.txt" 'Preserve your existing .env here. No secrets are included in this package.'
          Set-Content "$root/logs/README.txt" 'Reserved for operator diagnostics. Preserve across updates.'
          Compress-Archive -Path $root -DestinationPath dist/RestaurantPOS-Monoblock1.zip

      - name: Upload versioned deployment package
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-pos-deployment
          path: dist/RestaurantPOS
          if-no-files-found: error

      - name: Upload Monoblock 1 installation package
        uses: actions/upload-artifact@v4
        with:
          name: monoblock1-installation
          path: dist/RestaurantPOS-Monoblock1.zip
          if-no-files-found: error

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: |
            dist/RestaurantPOS.exe
            dist/RestaurantAdmin.exe
            dist/RestaurantServer.exe
            dist/SHA256.json
            dist/update_windows.ps1
            dist/install_autostart_windows.ps1
            dist/start-runtime.ps1
            dist/RestaurantBootstrapAdmin.exe
          if-no-files-found: error
