name: Build Windows Executables

on:
  push:
    branches: [phase-13-two-monoblock]
  pull_request:
    branches: [phase-13-two-monoblock]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: restaurant
          POSTGRES_PASSWORD: restaurant
          POSTGRES_DB: restaurant_pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Configure DATABASE_URL
        shell: bash
        run: |
          echo "DATABASE_URL=postgresql+psycopg2://restaurant:restaurant@localhost:5432/restaurant_pos" >> $GITHUB_ENV
          echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV

      - name: Run alembic upgrade
        shell: bash
        run: |
          python -m alembic -c alembic.ini upgrade head

      - name: Verify database connection
        shell: bash
        run: |
          python -c "import sqlalchemy; engine = sqlalchemy.create_engine('${{ env.DATABASE_URL }}'); conn = engine.connect(); conn.execute(sqlalchemy.text('SELECT 1')); conn.close(); print('Database connected')"

      - name: Run tests
        shell: bash
        run: |
          export DEBUG=false
          python -m pytest -q
        continue-on-error: false

      - name: Check alembic
        shell: bash
        run: |
          python -m alembic -c alembic.ini check

  build-windows:
    needs: [test]
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install PyInstaller
        shell: pwsh
        run: |
          python -m pip install pyinstaller

      - name: Build RestaurantPOS.exe
        shell: pwsh
        run: |
          Remove-Item Env:DEBUG -ErrorAction SilentlyContinue
          python -m PyInstaller --noconfirm --clean pos.spec

      - name: Build RestaurantAdmin.exe
        shell: pwsh
        run: |
          Remove-Item Env:DEBUG -ErrorAction SilentlyContinue
          python -m PyInstaller --noconfirm --clean admin.spec

      - name: Build RestaurantServer.exe
        shell: pwsh
        run: |
          Remove-Item Env:DEBUG -ErrorAction SilentlyContinue
          python -m PyInstaller --noconfirm --clean server.spec

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: |
            dist/RestaurantPOS.exe
            dist/RestaurantAdmin.exe
            dist/RestaurantServer.exe
          if-no-files-found: error
